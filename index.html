<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>公営競技サーチ Pro</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #1a2a3a; margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #clock-container { color: white; text-align: center; margin-bottom: 10px; font-family: 'Courier New', Courier, monospace; flex-shrink: 0; }
        #date { font-size: 13px; letter-spacing: 2px; opacity: 0.6; }
        #time { font-size: 28px; font-weight: bold; margin-top: 3px; }
        .slider-viewport { width: 100%; max-width: 340px; overflow: hidden; position: relative; }
        .slider-canvas { display: flex; transition: transform 0.3s ease-out; width: 200%; }
        .container { background-color: white; border-radius: 25px; padding: 20px; width: 50%; box-sizing: border-box; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.4); flex-shrink: 0; }
        .keirin-card { border-top: 8px solid #ff7e5f; }
        .boat-card { border-top: 8px solid #0091ff; }
        h1 { font-size: 18px; color: #1a2a3a; margin-bottom: 15px; }
        label { display: block; text-align: left; font-weight: bold; color: #777; margin-bottom: 6px; font-size: 12px; }
        .select-wrapper { margin-bottom: 10px; }
        select { width: 100%; padding: 10px; border: 1px solid #eee; border-radius: 10px; font-size: 16px; background-color: #fcfcfc; }
        
        /* ★特徴表示エリアのスタイル */
        .info-box {
            background-color: #f9f9f9;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 15px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-left: 4px solid #ddd;
        }
        .info-text { font-size: 12px; color: #555; text-align: left; line-height: 1.4; }
        .keirin-card .info-box { border-left-color: #ff7e5f; }
        .boat-card .info-box { border-left-color: #0091ff; }

        .btn-keirin { background: linear-gradient(135deg, #ff7e5f, #feb47b); color: white; border: none; padding: 14px; border-radius: 50px; font-size: 15px; font-weight: bold; width: 100%; box-shadow: 0 6px 12px rgba(255, 126, 95, 0.3); cursor: pointer; }
        .btn-boat { background: linear-gradient(135deg, #0091ff, #64b5f6); color: white; border: none; padding: 14px; border-radius: 50px; font-size: 15px; font-weight: bold; width: 100%; box-shadow: 0 6px 12px rgba(0, 145, 255, 0.3); cursor: pointer; }
        .footer-text { font-size: 10px; color: #aaa; margin-top: 10px; }
        .note-section { margin-top: 15px; padding-top: 10px; border-top: 1px dashed #eee; }
        .note-link { color: #2cb696; text-decoration: none; font-weight: bold; font-size: 13px; }
        .dots { display: flex; justify-content: center; margin-top: 15px; gap: 8px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.3); }
        .dot.active { background: white; }
    </style>
</head>
<body>

<div id="clock-container">
    <div id="date"></div>
    <div id="time"></div>
</div>

<div class="slider-viewport" id="viewport">
    <div class="slider-canvas" id="canvas">
        
        <div class="container keirin-card">
            <h1>🚴‍♂️ 競輪予想サーチ</h1>
            <label>開催地を選択</label>
            <div class="select-wrapper"><select id="track-keirin" onchange="updateInfo('keirin')"></select></div>
            
            <div class="info-box"><div id="info-keirin" class="info-text">会場を選択してください</div></div>

            <label>レース番号</label>
            <div class="select-wrapper"><select id="race-keirin"></select></div>
            <button class="btn-keirin" onclick="search('keirin')">𝕏 で競輪予想を探す</button>
            <p class="footer-text">← スワイプでボートへ</p>
            <div class="note-section">
                <a href="https://note.com/deep_lilac7083" target="_blank" class="note-link">公式note: deep_lilac7083</a>
            </div>
        </div>

        <div class="container boat-card">
            <h1>🚤 ボート予想サーチ</h1>
            <label>開催地を選択</label>
            <div class="select-wrapper"><select id="track-boat" onchange="updateInfo('boat')"></select></div>

            <div class="info-box"><div id="info-boat" class="info-text">会場を選択してください</div></div>

            <label>レース番号</label>
            <div class="select-wrapper"><select id="race-boat"></select></div>
            <button class="btn-boat" onclick="search('boat')">𝕏 でボート予想を探す</button>
            <p class="footer-text">競輪へスワイプ →</p>
            <div class="note-section">
                <a href="https://note.com/deep_lilac7083" target="_blank" class="note-link">公式note: deep_lilac7083</a>
            </div>
        </div>

    </div>
</div>

<div class="dots">
    <div class="dot active" id="dot0"></div>
    <div class="dot" id="dot1"></div>
</div>

<script>
    // 場の特徴データ（例としていくつか。必要に応じて書き換えてください！）
    const keirinInfo = {
        "いわき平": "国内唯一の空中バンク。風の影響を受けやすく、クセがない。",
        "松戸": "333バンク。直線が極端に短く、先行争いが激しい。",
        "名古屋": "直線が長く、捲りや追い込みが決まりやすい平原バンク。",
        "小倉": "ドームなので無風。スピード自慢の選手が有利。",
        "default": "各選手の特徴と直線の長さを考慮した展開予想がカギ。"
    };

    const boatInfo = {
        "住之江": "ボートレースの聖地。インが強いが、ナイターはさらに堅い。",
        "平和島": "インが弱く、万舟が出やすい。カドからの捲りに注目。",
        "戸田": "日本一狭い水面。1コースがとにかく苦戦する波乱の場。",
        "鳴門": "潮の流れが複雑。地元選手のコース取りが重要。",
        "default": "水面状況（淡水・海水）と風向きを確認しましょう。"
    };

    const kTracks = ["函館", "青森", "いわき平", "弥彦", "前橋", "取手", "宇都宮", "大宮", "西武園", "京王閣", "立川", "松戸", "千葉", "川崎", "平塚", "小田原", "伊東", "静岡", "名古屋", "岐阜", "大垣", "豊橋", "富山", "松阪", "四日市", "福井", "奈良", "向日町", "和歌山", "岸和田", "玉野", "広島", "防府", "高松", "小松島", "松山", "高知", "小倉", "久留米", "武雄", "佐世保", "別府", "熊本"];
    const bTracks = ["桐生", "戸田", "江戸川", "平和島", "多摩川", "浜名湖", "蒲郡", "常滑", "津", "三国", "びわこ", "住之江", "尼崎", "鳴門", "丸亀", "児島", "宮島", "徳山", "下関", "若松", "芦屋", "福岡", "唐津", "大村"];
    
    function init() {
        fillSelect("track-keirin", kTracks);
        fillSelect("track-boat", bTracks);
        fillSelect("race-keirin", Array.from({length: 12}, (_, i) => (i+1) + "R"));
        fillSelect("race-boat", Array.from({length: 12}, (_, i) => (i+1) + "R"));
        updateInfo('keirin'); updateInfo('boat');
        updateClock(); setInterval(updateClock, 1000);
    }

    function fillSelect(id, list) {
        const el = document.getElementById(id);
        list.sort().forEach(t => {
            const o = document.createElement("option"); o.value = t; o.textContent = t; el.appendChild(o);
        });
    }

    // ★特徴を更新する関数
    function updateInfo(type) {
        const val = document.getElementById(`track-${type}`).value;
        const data = type === 'keirin' ? keirinInfo : boatInfo;
        document.getElementById(`info-${type}`).innerText = data[val] || data["default"];
    }

    function search(type) {
        const track = document.getElementById(`track-${type}`).value;
        const race = document.getElementById(`race-${type}`).value;
        const keyword = type === 'keirin' ? '競輪' : 'ボートレース';
        const query = encodeURIComponent(`${track}${keyword} ${race} 予想`);
        window.open(`https://twitter.com/search?q=${query}&f=live`, '_blank');
    }

    function updateClock() {
        const now = new Date();
        const y = now.getFullYear(); const m = now.getMonth() + 1; const d = now.getDate();
        const day = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"][now.getDay()];
        document.getElementById("date").innerText = `${y}.${m}.${d} ${day}`;
        document.getElementById("time").innerText = now.toLocaleTimeString('ja-JP', { hour12: false });
    }

    let startX = 0; let currentIdx = 0;
    const canvas = document.getElementById("canvas");
    window.addEventListener("touchstart", (e) => { startX = e.touches[0].pageX; });
    window.addEventListener("touchend", (e) => {
        let diff = startX - e.changedTouches[0].pageX;
        if (Math.abs(diff) > 50) {
            currentIdx = diff > 0 ? 1 : 0;
            canvas.style.transform = `translateX(-${currentIdx * 50}%)`;
            document.getElementById("dot0").classList.toggle("active", currentIdx === 0);
            document.getElementById("dot1").classList.toggle("active", currentIdx === 1);
        }
    });
    init();
</script>
</body>
</html>
