<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>公認競技サーチ Pro</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #1a2a3a; margin: 0; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-top: 30px; }
        #clock-container { color: white; text-align: center; margin-bottom: 20px; font-family: 'Courier New', Courier, monospace; opacity: 0.8; }
        #date { font-size: 14px; letter-spacing: 2px; }
        #time { font-size: 32px; font-weight: bold; margin-top: 5px; }
        .slider-viewport { width: 100%; max-width: 350px; overflow: hidden; position: relative; }
        .slider-canvas { display: flex; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); width: 200%; }
        .container { background-color: white; border-radius: 30px; padding: 30px 20px; width: 50%; box-sizing: border-box; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4); flex-shrink: 0; margin: 0 5px; min-height: 480px; }
        .keirin-card { border-top: 10px solid #ff7e5f; }
        .boat-card { border-top: 10px solid #0091ff; }
        h1 { font-size: 20px; color: #1a2a3a; margin-bottom: 25px; }
        select { width: 100%; padding: 15px; border: 1px solid #eee; border-radius: 15px; font-size: 16px; background-color: #fcfcfc; margin-bottom: 20px; }
        .info-display-outer { width: 100%; text-align: center; border-radius: 20px; background: #f8f9fa; padding: 20px; box-sizing: border-box; min-height: 200px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; text-align: left; }
        .info-label { color: #aaa; font-size: 10px; font-weight: bold; display: block; }
        .info-item { font-size: 14px; color: #333; border-bottom: 1px solid #eaeaea; padding-bottom: 5px; }
        .info-item b { color: #ff7e5f; font-size: 15px; }
        .boat-card .info-item b { color: #0091ff; }
        .info-description { grid-column: 1 / 3; padding-top: 12px; font-size: 12px; color: #666; line-height: 1.6; text-align: left; }
        .dots { display: flex; justify-content: center; margin-top: 20px; gap: 10px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: 0.3s; }
        .dot.active { background: white; transform: scale(1.3); }
        .footer-content { width: 100%; max-width: 350px; margin-top: 40px; padding-bottom: 50px; }
        .note-box { background: white; padding: 15px; border-radius: 15px; margin-bottom: 15px; }
        .legal-links { display: flex; justify-content: center; gap: 20px; color: rgba(255,255,255,0.3); font-size: 11px; }
    </style>
</head>
<body>

    <div id="clock-container">
        <div id="date">0000.00.00 ---</div>
        <div id="time">00:00:00</div>
    </div>

    <div class="slider-viewport">
        <div class="slider-canvas" id="slider">
            <div class="container keirin-card">
                <h1>🚴 競輪サーチ Pro</h1>
                <select id="k-select" onchange="updateK()">
                    <option value="">-- 全43場から選択 --</option>
                    <option value="函館">函館</option><option value="青森">青森</option><option value="いわき平">いわき平</option>
                    <option value="弥彦">弥彦</option><option value="前橋">前橋</option><option value="取手">取手</option>
                    <option value="宇都宮">宇都宮</option><option value="大宮">大宮</option><option value="西武園">西武園</option>
                    <option value="京王閣">京王閣</option><option value="立川">立川</option><option value="松戸">松戸</option>
                    <option value="千葉">千葉JP250</option><option value="川崎">川崎</option><option value="平塚">平塚</option>
                    <option value="小田原">小田原</option><option value="伊東">伊東</option><option value="静岡">静岡</option>
                    <option value="名古屋">名古屋</option><option value="岐阜">岐阜</option><option value="大垣">大垣</option>
                    <option value="豊橋">豊橋</option><option value="富山">富山</option><option value="松阪">松阪</option>
                    <option value="四日市">四日市</option><option value="福井">福井</option><option value="奈良">奈良</option>
                    <option value="向日町">向日町</option><option value="和歌山">和歌山</option><option value="岸和田">岸和田</option>
                    <option value="玉野">玉野</option><option value="広島">広島</option><option value="防府">防府</option>
                    <option value="高松">高松</option><option value="小松島">小松島</option><option value="高知">高知</option>
                    <option value="松山">松山</option><option value="小倉">小倉</option><option value="久留米">久留米</option>
                    <option value="武雄">武雄</option><option value="佐世保">佐世保</option><option value="別府">別府</option><option value="熊本">熊本</option>
                </select>
                <div class="info-display-outer">
                    <div id="k-info" class="info-grid">
                        <div class="info-item"><span class="info-label">周長</span><span id="k1">---</span></div>
                        <div class="info-item"><span class="info-label">直線</span><span id="k2">---</span></div>
                        <div class="info-item"><span class="info-label">カント</span><span id="k3">---</span></div>
                        <div class="info-item"><span class="info-label">有利</span><span id="k4">---</span></div>
                        <div id="k-desc" class="info-description">場を選択すると特徴が表示されます。</div>
                    </div>
                </div>
            </div>

            <div class="container boat-card">
                <h1>🚤 ボートサーチ Pro</h1>
                <select id="b-select" onchange="updateB()">
                    <option value="">-- 全24場から選択 --</option>
                    <option value="桐生">桐生</option><option value="戸田">戸田</option><option value="江戸川">江戸川</option><option value="平和島">平和島</option><option value="多摩川">多摩川</option><option value="浜名湖">浜名湖</option><option value="蒲郡">蒲郡</option><option value="常滑">常滑</option><option value="津">津</option><option value="三国">三国</option><option value="びわこ">びわこ</option><option value="住之江">住之江</option><option value="尼崎">尼崎</option><option value="鳴門">鳴門</option><option value="丸亀">丸亀</option><option value="児島">児島</option><option value="宮島">宮島</option><option value="徳山">徳山</option><option value="下関">下関</option><option value="若松">若松</option><option value="芦屋">芦屋</option><option value="福岡">福岡</option><option value="唐津">唐津</option><option value="大村">大村</option>
                </select>
                <div class="info-display-outer">
                    <div id="b-info" class="info-grid">
                        <div class="info-item"><span class="info-label">水質</span><span id="b1">---</span></div>
                        <div class="info-item"><span class="info-label">イン勝率</span><span id="b2">---</span></div>
                        <div class="info-item"><span class="info-label">風・潮</span><span id="b3">---</span></div>
                        <div class="info-item"><span class="info-label">特徴</span><span id="b4">---</span></div>
                        <div id="b-desc" class="info-description">場を選択すると詳細な水面データが表示されます。</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="dots">
        <div class="dot active" id="dot0"></div>
        <div class="dot" id="dot1"></div>
    </div>

    <div class="footer-content">
        <div class="note-box">
            <h4 style="margin:0; font-size:12px;">Note</h4>
            <p style="margin:5px 0 0 0; font-size:10px; color:#777;">天候や風の影響を強く受ける競技です。最終確認は公式発表をご参照ください。</p>
        </div>
        <div class="legal-links"><span>Privacy Policy</span> | <span>Terms</span> | <span>Contact</span></div>
    </div>

    <script>
        function updateK() {
            const name = document.getElementById('k-select').value;
            let d = ["400m", "54.0m", "31度", "万能", "標準的なバンク。逃げ、捲り、差しのバランスが良い。"];
            if(name.match(/松戸|小田原|伊東|富山|奈良|前橋/)) d = ["333m", "38.2m", "29度", "先行", "短直線バンク。早めの仕掛けや逃げ切りが圧倒的に有利。"];
            if(name.match(/大宮|宇都宮|高知|熊本/)) d = ["500m", "66.7m", "24度", "差し", "長直線バンク。最終直線での追い込み・突き抜けに注意。"];
            if(name === "千葉") d = ["250m", "---", "30度", "脚力", "木製ピスト。純粋なスピードと持久力の勝負になる。"];
            
            document.getElementById('k1').innerHTML = `<b>${d[0]}</b>`;
            document.getElementById('k2').innerHTML = `<b>${d[1]}</b>`;
            document.getElementById('k3').innerHTML = `<b>${d[2]}</b>`;
            document.getElementById('k4').innerHTML = `<b>${d[3]}</b>`;
            document.getElementById('k-desc').innerText = d[4];
        }

        function updateB() {
            const name = document.getElementById('b-select').value;
            let d = ["淡水", "標準", "安定", "逃げ", "全国平均的な水面。1コースの信頼度は比較的高い。"];
            if(name.match(/常滑|蒲郡|下関|若松|福岡|唐津|大村/)) d[0] = "海水";
            if(name.match(/戸田|江戸川|平和島/)) { d[1] = "低い"; d[3] = "捲り"; d[4] = "インが弱く、カドからの捲りや差しが決まりやすい。"; }
            if(name.match(/大村|徳山|芦屋/)) { d[1] = "最強"; d[3] = "イン"; d[4] = "イン逃げを軸にした組み立てが基本。鉄板レースが多い。"; }
            
            document.getElementById('b1').innerHTML = `<b>${d[0]}</b>`;
            document.getElementById('b2').innerHTML = `<b>${d[1]}</b>`;
            document.getElementById('b3').innerHTML = `<b>${d[2]}</b>`;
            document.getElementById('b4').innerHTML = `<b>${d[3]}</b>`;
            document.getElementById('b-desc').innerText = d[4];
        }

        function tick() {
            const n = new Date();
            document.getElementById('date').innerText = n.toLocaleDateString();
            document.getElementById('time').innerText = n.toTimeString().split(' ')[0];
        }
        setInterval(tick, 1000); tick();

        let s = 0;
        setInterval(() => {
            s = 1 - s;
            document.getElementById('slider').style.transform = `translateX(-${s * 50}%)`;
            document.getElementById('dot0').classList.toggle('active', s === 0);
            document.getElementById('dot1').classList.toggle('active', s === 1);
        }, 7000);
    </script>
</body>
</html>
