<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>公営競技サーチ Pro | 競輪・ボートレース予想支援</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #1a2a3a; margin: 0; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        #clock-container { color: white; text-align: center; padding: 25px 0 10px; font-family: 'Courier New', Courier, monospace; }
        #date { font-size: 13px; letter-spacing: 2px; opacity: 0.6; }
        #time { font-size: 28px; font-weight: bold; margin-top: 3px; }

        .slider-viewport { width: 100%; max-width: 330px; overflow: hidden; position: relative; margin-top: 10px; }
        .slider-canvas { display: flex; transition: transform 0.3s ease-out; width: 200%; }
        .container { background-color: white; border-radius: 25px; padding: 25px 20px; width: 50%; box-sizing: border-box; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.4); flex-shrink: 0; margin: 0 5px; }
        .keirin-card { border-top: 8px solid #ff7e5f; }
        .boat-card { border-top: 8px solid #0091ff; }
        h1 { font-size: 18px; color: #1a2a3a; margin-bottom: 20px; }
        label { display: block; text-align: left; font-weight: bold; color: #777; margin-bottom: 6px; font-size: 11px; }
        select { width: 100%; padding: 12px; border: 1px solid #eee; border-radius: 10px; font-size: 16px; margin-bottom: 15px; }
        .btn-search { color: white; border: none; padding: 15px; border-radius: 50px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; }
        .btn-keirin { background: linear-gradient(135deg, #ff7e5f, #feb47b); }
        .btn-boat { background: linear-gradient(135deg, #0091ff, #64b5f6); }
        
        .info-display-outer { width: 100%; max-width: 320px; margin-top: 20px; text-align: center; min-height: 120px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; color: #dcdcdc; font-size: 12px; text-align: left; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 15px; }
        .info-item b { color: #feb47b; font-size: 10px; margin-right: 4px; }
        .info-description { grid-column: 1 / 3; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; margin-top: 5px; font-size: 12px; color: #fff; }

        .footer-stats { font-size: 9px; color: #556677; margin-top: 30px; letter-spacing: 1px; }
        .stat-val { font-weight: bold; color: #778899; }

        .ads-container { width: 100%; max-width: 320px; margin: 40px 0 20px; text-align: center; min-height: 100px; background: rgba(255,255,255,0.02); border: 1px dashed rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; }
        .ads-label { font-size: 9px; color: #445566; margin-bottom: 5px; display: block; }

        .site-footer { width: 100%; background: #15222e; padding: 30px 20px; margin-top: auto; text-align: center; box-sizing: border-box; }
        .footer-links a { color: #8899aa; text-decoration: none; font-size: 11px; margin: 0 10px; border-bottom: 1px solid #334455; }
        .disclaimer { font-size: 10px; color: #556677; line-height: 1.5; margin: 20px auto; max-width: 300px; }
    </style>
</head>
<body>

<div id="clock-container">
    <div id="date"></div>
    <div id="time"></div>
</div>

<div class="slider-viewport" id="viewport">
    <div class="slider-canvas" id="canvas">
        <div class="container keirin-card">
            <h1>🚴‍♂️ 競輪サーチ</h1>
            <label>会場</label><select id="track-keirin" onchange="updateInfo()"></select>
            <label>レース</label><select id="race-keirin"></select>
            <button class="btn-search btn-keirin" onclick="search('keirin')">𝕏 で予想を探す</button>
        </div>
        <div class="container boat-card">
            <h1>🚤 ボートサーチ</h1>
            <label>会場</label><select id="track-boat" onchange="updateInfo()"></select>
            <label>レース</label><select id="race-boat"></select>
            <button class="btn-search btn-boat" onclick="search('boat')">𝕏 で予想を探す</button>
        </div>
    </div>
</div>

<div class="info-display-outer">
    <div id="info-grid" class="info-grid"></div>
</div>

<div class="footer-stats">
    ONLINE: <span id="online-count" class="stat-val">--</span> / TOTAL: <span id="total-count" class="stat-val">--</span>
</div>

<div class="ads-container">
    <span class="ads-label">SPONSORED</span>
    <div style="color: #334455; font-size: 12px; margin-top: 30px;">ADVERTISING SPACE</div>
</div>

<footer class="site-footer">
    <div class="footer-links">
        <a href="https://note.com/deep_lilac7083" target="_blank">運営者note</a>
        <a href="policy.html"">プライバシーポリシー</a>
    </div>
    <p class="disclaimer">
        【免責事項】本ツールは情報収集の補助を目的としており、的中を保証するものではありません。投票は必ずご自身の判断と責任において行ってください。
    </p>
    <p style="color: #445566; font-size: 9px;">© <span id="current-year"></span> 公営競技サーチ Pro</p>
</footer>

<script>
    const keirinData = { "いわき平": { bank: "400m", straight: "62.7m", cant: "32°", trend: "差し", desc: "空中バンク。風が吹き抜けやすい。" }, "松戸": { bank: "333m", straight: "38.2m", cant: "29°", trend: "逃げ", desc: "直線が短い。先行圧倒的有利。" }, "default": { bank: "---", straight: "---", cant: "---", trend: "要確認", desc: "会場を選択すると詳細データが表示されます。" } };
    const boatData = { "住之江": { water: "淡水", flow: "なし", motor: "標準", trend: "イン最強", desc: "聖地。イン逃げ信頼。" }, "戸田": { water: "淡水", flow: "なし", motor: "減音", trend: "捲り差し", desc: "狭い水面。カド捲り注意。" }, "default": { water: "---", flow: "---", motor: "---", trend: "要確認", desc: "会場を選択すると詳細データが表示されます。" } };
    const kTracks = ["函館", "青森", "いわき平", "弥彦", "前橋", "取手", "宇都宮", "大宮", "西武園", "京王閣", "立川", "松戸", "千葉", "川崎", "平塚", "小田原", "伊東", "静岡", "名古屋", "岐阜", "大垣", "豊橋", "富山", "松阪", "四日市", "福井", "奈良", "向日町", "和歌山", "岸和田", "玉野", "広島", "防府", "高松", "小松島", "松山", "高知", "小倉", "久留米", "武雄", "佐世保", "別府", "熊本"];
    const bTracks = ["桐生", "戸田", "江戸川", "平和島", "多摩川", "浜名湖", "蒲郡", "常滑", "津", "三国", "びわこ", "住之江", "尼崎", "鳴門", "丸亀", "児島", "宮島", "徳山", "下関", "若松", "芦屋", "福岡", "唐津", "大村"];

    let currentIdx = 0;
    let fakeTotal = 1542;

    function init() {
        fillSelect("track-keirin", kTracks);
        fillSelect("track-boat", bTracks);
        fillSelect("race-keirin", Array.from({length: 12}, (_, i) => (i+1) + "R"));
        fillSelect("race-boat", Array.from({length: 12}, (_, i) => (i+1) + "R"));
        
        // 西暦の自動設定
        document.getElementById('current-year').innerText = new Date().getFullYear();
        
        updateClock(); setInterval(updateClock, 1000);
        startFakeCounter();
        updateInfo();
    }

    function startFakeCounter() {
        let online = Math.floor(Math.random() * 8) + 4;
        document.getElementById('online-count').innerText = online;
        document.getElementById('total-count').innerText = fakeTotal.toLocaleString();
        setInterval(() => {
            online += Math.floor(Math.random() * 3) - 1;
            if (online < 2) online = 2;
            document.getElementById('online-count').innerText = online;
        }, 5000);
        setInterval(() => {
            fakeTotal += 1;
            document.getElementById('total-count').innerText = fakeTotal.toLocaleString();
        }, 12000);
    }

    function fillSelect(id, list) {
        const el = document.getElementById(id);
        list.sort().forEach(t => {
            const o = document.createElement("option"); o.value = t; o.textContent = t; el.appendChild(o);
        });
    }

    function updateInfo() {
        const type = currentIdx === 0 ? 'keirin' : 'boat';
        const val = document.getElementById(`track-${type}`).value;
        const grid = document.getElementById('info-grid');
        if (type === 'keirin') {
            const d = keirinData[val] || keirinData["default"];
            grid.innerHTML = `<div class="info-item"><b>バンク</b>${d.bank}</div><div class="info-item"><b>直線</b>${d.straight}</div><div class="info-item"><b>カント</b>${d.cant}</div><div class="info-item"><b>傾向</b>${d.trend}</div><div class="info-description">${d.desc}</div>`;
        } else {
            const d = boatData[val] || boatData["default"];
            grid.innerHTML = `<div class="info-item"><b>水質</b>${d.water}</div><div class="info-item"><b>潮流</b>${d.flow}</div><div class="info-item"><b>モーター</b>${d.motor}</div><div class="info-item"><b>傾向</b>${d.trend}</div><div class="info-description">${d.desc}</div>`;
        }
    }

    function search(type) {
        const track = document.getElementById(`track-${type}`).value;
        const race = document.getElementById(`race-${type}`).value;
        const query = encodeURIComponent(`${track}${type==='keirin'?'競輪':'ボートレース'} ${race} 予想`);
        window.open(`https://twitter.com/search?q=${query}&f=live`, '_blank');
    }

    function updateClock() {
        const now = new Date();
        document.getElementById("date").innerText = `${now.getFullYear()}.${now.getMonth() + 1}.${now.getDate()}`;
        document.getElementById("time").innerText = now.toLocaleTimeString('ja-JP', { hour12: false });
    }

    let startX = 0;
    const canvas = document.getElementById("canvas");
    window.addEventListener("touchstart", (e) => { startX = e.touches[0].pageX; });
    window.addEventListener("touchend", (e) => {
        let diff = startX - e.changedTouches[0].pageX;
        if (Math.abs(diff) > 50) {
            currentIdx = diff > 0 ? 1 : 0;
            canvas.style.transform = `translateX(-${currentIdx * 50}%)`;
            updateInfo();
        }
    });
    init();
</script>
</body>
</html>
