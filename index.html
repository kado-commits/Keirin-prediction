<script>
const tracks = ["函館", "青森", "いわき平", "弥彦", "前橋", "取手", "宇都宮", "大宮", "西武園", "京王閣", "立川", "松戸", "千葉", "川崎", "平塚", "小田原", "伊東", "静岡", "名古屋", "岐阜", "大垣", "豊橋", "富山", "松阪", "四日市", "福井", "奈良", "向日町", "和歌山", "岸和田", "玉野", "広島", "防府", "高松", "小松島", "高知", "松山", "小倉", "久留米", "武雄", "佐世保", "別府", "熊本"];
function init() {
    const trackSelect = document.getElementById("track");
    tracks.sort().forEach(t => {
        const o = document.createElement("option"); o.value = t; o.textContent = t; trackSelect.appendChild(o);
    });
    const raceSelect = document.getElementById("race");
    for (let i = 1; i <= 12; i++) {
        const o = document.createElement("option"); o.value = i; o.textContent = i + "R"; raceSelect.appendChild(o);
    }
}
document.addEventListener("DOMContentLoaded", init);
function search() {
    const track = document.getElementById("track").value;
    const race = document.getElementById("race").value;
    const query = `${track}競輪 ${race}R 予想`;
    window.open(`https://twitter.com/search?q=${encodeURIComponent(query)}&f=live`, "_blank");
}
