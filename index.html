<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>公営競技サーチ Pro</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #1a2a3a; margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #clock-container { color: white; text-align: center; margin-bottom: 15px; font-family: 'Courier New', Courier, monospace; flex-shrink: 0; }
        #date { font-size: 13px; letter-spacing: 2px; opacity: 0.6; }
        #time { font-size: 28px; font-weight: bold; margin-top: 3px; }
        .slider-viewport { width: 100%; max-width: 330px; overflow: hidden; position: relative; }
        .slider-canvas { display: flex; transition: transform 0.3s ease-out; width: 200%; }
        .container { background-color: white; border-radius: 25px; padding: 25px 20px; width: 50%; box-sizing: border-box; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.4); flex-shrink: 0; margin: 0 5px; }
        .keirin-card { border-top: 8px solid #ff7e5f; }
        .boat-card { border-top: 8px solid #0091ff; }
        h1 { font-size: 18px; color: #1a2a3a; margin-bottom: 20px; }
        label { display: block; text-align: left; font-weight: bold; color: #777; margin-bottom: 6px; font-size: 12px; }
        .select-wrapper { margin-bottom: 18px; }
        select { width: 100%; padding: 10px; border: 1px solid #eee; border-radius: 10px; font-size: 16px; background-color: #fcfcfc; -webkit-appearance: none; }
        .btn-keirin { background: linear-gradient(135deg, #ff7e5f, #feb47b); color: white; border: none; padding: 15px; border-radius: 50px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; }
        .btn-boat { background: linear-gradient(135deg, #0091ff, #64b5f6); color: white; border: none; padding: 15px; border-radius: 50px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; }
        
        /* 今日の修正：審査対策＆ナビゲーション */
        .note-section { margin-top: 20px; padding-top: 15px; border-top: 1px dashed #eee; }
        .note-description { font-size: 10px; color: #999; margin-bottom: 5px; display: block; }
        .note-link { color: #2cb696; text-decoration: none; font-weight: bold; font-size: 13px; border-bottom: 1px solid #2cb696; padding-bottom: 2px; }
        
        .info-display-outer { width: 100%; max-width: 320px; margin-top: 20px; text-align: center; min-height: 120px; }
        .info-label { color: #778899; font-size: 10px; font-weight: bold; letter-spacing: 2px; margin-bottom: 8px; display: block; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; color: #dcdcdc; font-size: 12px; text-align: left; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 15px; }
        .info-item b { color: #feb47b; font-size: 11px; margin-right: 4px; }
        .info-description { grid-column: 1 / 3; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; margin-top: 5px; font-size: 12px; color: #fff; text-align: center; line-height: 1.4; }
        
        .dots { display: flex; justify-content: center; margin-top: 15px; gap: 8px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.3); transition: 0.3s; }
        .dot.active { background: white; transform: scale(1.2); }
    </style>
</head>
<body>

<div id="clock-container">
    <div id="date"></div>
    <div id="time"></div>
</div>

<div class="slider-viewport" id="viewport">
    <div class="slider-canvas" id="canvas">
        <div class="container keirin-card">
            <h1>🚴‍♂️ 競輪予想サーチ</h1>
            <label>開催地を選択</label>
            <div class="select-wrapper"><select id="track-keirin" onchange="updateInfo()"></select></div>
            <label>レース番号</label>
            <div class="select-wrapper"><select id="race-keirin"></select></div>
            <button class="btn-keirin" onclick="search('keirin')">𝕏 で探す</button>
            <div class="note-section">
                <span class="note-description">数値から展開を読み解く</span>
                <a href="https://note.com/deep_lilac7083" target="_blank" class="note-link">管理者の競輪noteを読む</a>
            </div>
        </div>
        <div class="container boat-card">
            <h1>🚤 ボート予想サーチ</h1>
            <label>開催地を選択</label>
            <div class="select-wrapper"><select id="track-boat" onchange="updateInfo()"></select></div>
            <label>レース番号</label>
            <div class="select-wrapper"><select id="race-boat"></select></div>
            <button class="btn-boat" onclick="search('boat')">𝕏 で探す</button>
            <div class="note-section">
                <span class="note-description">独自の波面分析・モーター評価</span>
                <a href="https://note.com/deep_lilac7083" target="_blank" class="note-link">管理者のボートnoteを読む</a>
            </div>
        </div>
    </div>
</div>

<div class="info-display-outer">
    <span class="info-label" id="strategy-label">FIELD STRATEGY</span>
    <div id="info-grid" class="info-grid">
        </div>
</div>

<div class="dots">
    <div class="dot active" id="dot0"></div>
    <div class="dot" id="dot1"></div>
</div>

<script>
    // データ定義（省略なし）
    const keirinData = {

        "青森": { bank: "400m", straight: "58.9m", cant: "32°", trend: "差し・捲り", desc: "直線が長く、後方からの追い込みが決まりやすい。" },
        "いわき平": { bank: "400m", straight: "62.7m", cant: "32°", trend: "差し", desc: "空中バンク。風が吹き抜けやすく波乱も。" },
        "弥彦": { bank: "400m", straight: "63.1m", cant: "32°", trend: "差し", desc: "直線が非常に長く、先行選手には厳しい。" },
        "前橋": { bank: "333m", straight: "46.7m", cant: "36°", trend: "逃げ", desc: "超高速ドーム。カントが日本一きつく逃げ有利。" },
        "取手": { bank: "400m", straight: "54.8m", cant: "31°", trend: "逃げ・差し", desc: "クセがなく、力通りの決着が多い。" },

        "西武園": { bank: "400m", straight: "47.6m", cant: "29°", trend: "逃げ", desc: "直線が短く、先行・番手有利な展開が多い。" },
        "京王閣": { bank: "400m", straight: "56.3m", cant: "32°", trend: "差し・捲り", desc: "風の影響は少ないが、直線はそこそこ長い。" },
        "立川": { bank: "400m", straight: "58.0m", cant: "31°", trend: "差し", desc: "直線が長く、ゴール前での逆転が多い。" },
        "松戸": { bank: "333m", straight: "38.2m", cant: "29°", trend: "逃げ", desc: "333バンクの代表格。早めの仕掛けが必須。" },
        "千葉": { bank: "250m", straight: "---", cant: "---", trend: "逃げ", desc: "PIST6専用。特殊な短距離高速レース。" },
        "川崎": { bank: "400m", straight: "58.0m", cant: "32°", trend: "差し・捲り", desc: "クセのないバンクで力勝負になりやすい。" },
        "平塚": { bank: "400m", straight: "54.2m", cant: "31°", trend: "逃げ・差し", desc: "海風が入り込む。カントは標準的。" },
        "小田原": { bank: "333m", straight: "36.1m", cant: "35°", trend: "逃げ", desc: "カントがきつく直線が短い。先行が絶対有利。" },
        "伊東": { bank: "333m", straight: "46.6m", cant: "31°", trend: "逃げ", desc: "333にしては直線があり、捲りも届く。" },
        "静岡": { bank: "400m", straight: "56.4m", cant: "30°", trend: "差し", desc: "富士山からの風「駿河おろし」に注意。" },
        "名古屋": { bank: "400m", straight: "58.8m", cant: "34°", trend: "差し・捲り", desc: "直線が長くカントもきつい。力勝負のバンク。" },
        "岐阜": { bank: "400m", straight: "59.3m", cant: "31°", trend: "差し", desc: "直線が長く、ゴール前で着順が入れ替わる。" },

        "富山": { bank: "333m", straight: "43.0m", cant: "33°", trend: "逃げ", desc: "333の中では直線があり、捲り差しも決まる。" },
        "松阪": { bank: "400m", straight: "61.5m", cant: "32°", trend: "差し", desc: "直線がかなり長く、追い込み勢の出番。" },
        "四日市": { bank: "400m", straight: "62.4m", cant: "32°", trend: "差し", desc: "ナイター専用。海風の影響で重くなる。" },
        "福井": { bank: "400m", straight: "52.8m", cant: "31°", trend: "逃げ・差し", desc: "クセがなく自力選手が走りやすい。" },
        "奈良": { bank: "333m", straight: "38.0m", cant: "33°", trend: "逃げ", desc: "典型的な333。インの先行が断然有利。" },
        "向日町": { bank: "400m", straight: "47.3m", cant: "30°", trend: "逃げ", desc: "直線が短く、前々にいないと厳しい。" },
        "和歌山": { bank: "400m", straight: "59.9m", cant: "32°", trend: "差し", desc: "海が近く風が強い。直線は長め。" },
        "岸和田": { bank: "400m", straight: "56.7m", cant: "30°", trend: "差し", desc: "クセがなく、力通りの決着が多い。" },
        "玉野": { bank: "400m", straight: "47.9m", cant: "30°", trend: "逃げ", desc: "直線が短く、瀬戸内海の風がレースを左右する。" },
        "広島": { bank: "400m", straight: "57.9m", cant: "30°", trend: "差し", desc: "クセはないが、海風で重くなることがある。" },
        "防府": { bank: "333m", straight: "42.5m", cant: "33°", trend: "逃げ", desc: "333の中では直線があり、地元勢が強い。" },
        "高松": { bank: "400m", straight: "54.4m", cant: "31°", trend: "逃げ・差し", desc: "チヌ（黒鯛）が跳ねる。風は不規則。" },
        "小松島": { bank: "400m", straight: "55.5m", cant: "30°", trend: "逃げ・差し", desc: "海が近く、強風時は波乱の予感。" },
        "松山": { bank: "400m", straight: "58.6m", cant: "33°", trend: "差し・捲り", desc: "カントがきつく、捲りが加速しやすい。" },
        "高知": { bank: "500m", straight: "52.0m", cant: "24°", trend: "逃げ・差し", desc: "500にしては直線が短く、捲りも決まる。" },
        "小倉": { bank: "400m", straight: "56.9m", cant: "34°", trend: "差し", desc: "ドーム無風。スピード自慢の差しが決まる。" },
        "久留米": { bank: "400m", straight: "50.7m", cant: "31°", trend: "逃げ・差し", desc: "クセが少なく、自力選手が活躍しやすい。" },
        "武雄": { bank: "400m", straight: "64.4m", cant: "31°", trend: "差し", desc: "日本最大級の直線。追い込み勢が有利。" },
        "佐世保": { bank: "400m", straight: "40.2m", cant: "31°", trend: "逃げ", desc: "直線が極端に短く、先行逃げ切りが多い。" },
        "別府": { bank: "400m", straight: "59.9m", cant: "33°", trend: "差し", desc: "海風が重く、直線で着順が入れ替わる。" },
        "熊本": { bank: "500m", straight: "60.3m", cant: "28°", trend: "差し", desc: "通称「武蔵塚バンク」。直線はかなり長い。" },
        "default": { bank: "---", straight: "---", cant: "---", trend: "要確認", desc: "会場を選択すると詳細データが表示されます。" }
    };

    const boatData = {
        "桐生": { water: "淡水", flow: "なし", motor: "標準", trend: "イン・捲り", desc: "標高が高く、冬は赤城おろしで波乱も。" },
        "戸田": { water: "淡水", flow: "なし", motor: "減音", trend: "捲り差し", desc: "日本一狭い水面。イン勝率は全国最低クラス。" },
        "江戸川": { water: "汽水", flow: "あり", motor: "標準", trend: "捲り", desc: "日本一の難所。風と潮で順位が激変する。" },
        "平和島": { water: "海水", flow: "あり", motor: "標準", trend: "差し・捲り", desc: "インが弱く配当が跳ねやすい。" },
        "多摩川": { water: "淡水", flow: "なし", motor: "標準", trend: "差し", desc: "日本一の静水面。スピード勝負になる。" },
        "浜名湖": { water: "汽水", flow: "あり", motor: "標準", trend: "差し・捲り", desc: "全国屈指の広大な水面。インも弱くない。" },
        "蒲郡": { water: "海水", flow: "なし", motor: "標準", trend: "イン有利", desc: "ナイターのインはかなり堅実。" },
        "常滑": { water: "海水", flow: "なし", motor: "標準", trend: "イン有利", desc: "イン勝率が高い。冬は伊勢湾の風に注意。" },
        "津": { water: "海水", flow: "あり", motor: "標準", trend: "イン・捲り", desc: "鈴鹿おろしが吹くと水面が荒れる。" },
        "三国": { water: "淡水", flow: "なし", motor: "標準", trend: "イン・捲り", desc: "1マークの幅が広く、多彩な攻めが可能。" },
        "びわこ": { water: "淡水", flow: "なし", motor: "標準", trend: "捲り", desc: "1マークが狭く、インが苦戦する場。" },
        "住之江": { water: "淡水", flow: "なし", motor: "標準", trend: "イン最強", desc: "ボートレースの聖地。イン逃げ信頼。" },
        "尼崎": { water: "淡水", flow: "なし", motor: "標準", trend: "イン有利", desc: "センターからの捲り差しも決まる場。" },
        "鳴門": { water: "海水", flow: "あり", motor: "標準", trend: "捲り差し", desc: "潮の流れが速い。地元勢のコース取りに注目。" },
        "丸亀": { water: "海水", flow: "あり", motor: "標準", trend: "イン・差し", desc: "潮の満ち引きでレース傾向がガラリと変わる。" },
        "児島": { water: "海水", flow: "あり", motor: "標準", trend: "イン有利", desc: "瀬戸内海の潮の影響を受ける。インは強め。" },
        "宮島": { water: "海水", flow: "あり", motor: "標準", trend: "イン有利", desc: "潮位の差が大きい。満潮時はインが有利。" },
        "徳山": { water: "海水", flow: "あり", motor: "標準", trend: "イン最強", desc: "全国トップクラスのイン勝率を誇る。" },
        "下関": { water: "海水", flow: "あり", motor: "標準", trend: "イン有利", desc: "ナイターはイン逃げがメイン。風は穏やか。" },
        "若松": { water: "海水", flow: "あり", motor: "標準", trend: "イン・捲り", desc: "夜になるとインがさらに強くなる。" },
        "芦屋": { water: "淡水", flow: "なし", motor: "標準", trend: "イン最強", desc: "モーニングはインの信頼度が非常に高い。" },
        "福岡": { water: "海水", flow: "あり", motor: "標準", trend: "捲り差し", desc: "特殊な水面形状。1コースが難しい場。" },
        "唐津": { water: "淡水", flow: "なし", motor: "標準", trend: "イン有利", desc: "水面が広く、実力者が順当に勝つ場。" },
        "大村": { water: "海水", flow: "あり", motor: "標準", trend: "イン絶対", desc: "元祖インの聖地。1コース勝率は日本一。" },
        "default": { water: "---", flow: "---", motor: "---", trend: "要確認", desc: "会場を選択すると詳細データが表示されます。" }
    };

    let currentIdx = 0;

    function init() {
        fillSelect("track-keirin", Object.keys(keirinData).filter(k => k !== "default"));
        fillSelect("track-boat", Object.keys(boatData).filter(k => k !== "default"));
        fillSelect("race-keirin", Array.from({length: 12}, (_, i) => (i+1) + "R"));
        fillSelect("race-boat", Array.from({length: 12}, (_, i) => (i+1) + "R"));
        
        updateClock(); 
        setInterval(updateClock, 1000);
        
        // 少し遅らせて初期情報を表示（バグ対策）
        setTimeout(updateInfo, 100);
    }

    function fillSelect(id, list) {
        const el = document.getElementById(id);
        el.innerHTML = "";
        list.sort().forEach(t => {
            const o = document.createElement("option"); o.value = t; o.textContent = t; el.appendChild(o);
        });
    }

    function updateInfo() {
        const type = currentIdx === 0 ? 'keirin' : 'boat';
        const val = document.getElementById(`track-${type}`).value;
        const grid = document.getElementById('info-grid');
        const label = document.getElementById('strategy-label');
        
        if (type === 'keirin') {
            const d = keirinData[val] || keirinData["default"];
            label.innerText = "TRACK ANALYSIS";
            grid.innerHTML = `
                <div class="info-item"><b>バンク</b>${d.bank}</div>
                <div class="info-item"><b>直線</b>${d.straight}</div>
                <div class="info-item"><b>カント</b>${d.cant}</div>
                <div class="info-item"><b>傾向</b>${d.trend}</div>
                <div class="info-description">${d.desc}</div>`;
        } else {
            const d = boatData[val] || boatData["default"];
            label.innerText = "WATER ANALYSIS";
            grid.innerHTML = `
                <div class="info-item"><b>水質</b>${d.water}</div>
                <div class="info-item"><b>潮流</b>${d.flow}</div>
                <div class="info-item"><b>モーター</b>${d.motor}</div>
                <div class="info-item"><b>傾向</b>${d.trend}</div>
                <div class="info-description">${d.desc}</div>`;
        }
    }

    function search(type) {
        const track = document.getElementById(`track-${type}`).value;
        const race = document.getElementById(`race-${type}`).value;
        const query = encodeURIComponent(`${track}${type==='keirin'?'競輪':'ボートレース'} ${race} 予想`);
        window.open(`https://twitter.com/search?q=${query}&f=live`, '_blank');
    }

    function updateClock() {
        const now = new Date();
        const y = now.getFullYear(); const m = now.getMonth() + 1; const d = now.getDate();
        const day = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"][now.getDay()];
        document.getElementById("date").innerText = `${y}.${m}.${d} ${day}`;
        document.getElementById("time").innerText = now.toLocaleTimeString('ja-JP', { hour12: false });
    }

    // スワイプイベントの修正
    let startX = 0;
    const canvas = document.getElementById("canvas");
    window.addEventListener("touchstart", (e) => { startX = e.touches[0].pageX; });
    window.addEventListener("touchend", (e) => {
        let diff = startX - e.changedTouches[0].pageX;
        if (Math.abs(diff) > 50) {
            currentIdx = diff > 0 ? 1 : 0;
            canvas.style.transform = `translateX(-${currentIdx * 50}%)`;
            document.getElementById("dot0").classList.toggle("active", currentIdx === 0);
            document.getElementById("dot1").classList.toggle("active", currentIdx === 1);
            // 今日の修正ポイント：カード切り替え後に即座に情報を更新
            updateInfo(); 
        }
    });

    init();
</script>
</body>
</html>
