<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>公営競技サーチ Pro</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #1a2a3a; margin: 0; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-top: 20px; }
        #clock-container { color: white; text-align: center; margin-bottom: 15px; font-family: monospace; }
        #date { font-size: 13px; letter-spacing: 2px; opacity: 0.6; }
        #time { font-size: 28px; font-weight: bold; margin-top: 3px; }

        .slider-viewport { width: 100%; max-width: 330px; overflow: hidden; position: relative; }
        .slider-canvas { display: flex; transition: transform 0.3s ease-out; width: 200%; }
        .container { background-color: white; border-radius: 25px; padding: 20px; width: 50%; box-sizing: border-box; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.4); flex-shrink: 0; margin: 0 5px; }
        .keirin-card { border-top: 8px solid #ff7e5f; }
        .boat-card { border-top: 8px solid #0091ff; }
        
        h1 { font-size: 18px; color: #1a2a3a; margin-bottom: 15px; }
        label { display: block; text-align: left; font-weight: bold; color: #777; margin-bottom: 5px; font-size: 11px; }
        .select-wrapper { margin-bottom: 15px; }
        select { width: 100%; padding: 12px; border: 1px solid #eee; border-radius: 12px; font-size: 16px; background-color: #fcfcfc; -webkit-appearance: none; appearance: none; outline: none; color: #333; }

        .btn-keirin { background: linear-gradient(135deg, #ff7e5f, #feb47b); color: white; border: none; padding: 14px; border-radius: 50px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; }
        .btn-boat { background: linear-gradient(135deg, #0091ff, #64b5f6); color: white; border: none; padding: 14px; border-radius: 50px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; }

        .info-display-outer { width: 100%; max-width: 320px; margin-top: 20px; text-align: center; }
        .info-label { color: #778899; font-size: 10px; font-weight: bold; letter-spacing: 2px; margin-bottom: 8px; display: block; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; color: #dcdcdc; font-size: 12px; text-align: left; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 15px; }
        .info-item b { color: #feb47b; font-size: 10px; margin-right: 5px; }
        .info-description { grid-column: 1 / 3; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; margin-top: 5px; color: #fff; text-align: center; line-height: 1.4; }
        
        .dots { display: flex; justify-content: center; margin-top: 15px; gap: 8px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.3); }
        .dot.active { background: white; }

        .ad-space { width: 90%; max-width: 330px; min-height: 250px; background: white; margin: 25px 0; border-radius: 15px; display: flex; align-items: center; justify-content: center; color: #ccc; font-size: 12px; }
        .footer-nav { display: flex; justify-content: center; gap: 15px; margin-bottom: 40px; }
        .footer-nav a { color: rgba(255,255,255,0.5); text-decoration: none; font-size: 11px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 2px; }
    </style>
</head>
<body>

<div id="clock-container">
    <div id="date"></div>
    <div id="time"></div>
</div>

<div class="slider-viewport">
    <div class="slider-canvas" id="canvas">
        <div class="container keirin-card">
            <h1>🚴 競輪予想サーチ</h1>
            <label>開催地を選択</label>
            <div class="select-wrapper"><select id="track-keirin" onchange="updateInfo()"></select></div>
            <label>レース番号</label>
            <div class="select-wrapper">
                <select id="race-keirin">
                    <option value="1R">1R</option><option value="2R">2R</option><option value="3R">3R</option><option value="4R">4R</option><option value="5R">5R</option><option value="6R">6R</option><option value="7R">7R</option><option value="8R">8R</option><option value="9R">9R</option><option value="10R" selected>10R</option><option value="11R">11R</option><option value="12R">12R</option>
                </select>
            </div>
            <button class="btn-keirin" onclick="search('keirin')">𝕏 で探す</button>
        </div>
        <div class="container boat-card">
            <h1>🚤 ボート予想サーチ</h1>
            <label>開催地を選択</label>
            <div class="select-wrapper"><select id="track-boat" onchange="updateInfo()"></select></div>
            <label>レース番号</label>
            <div class="select-wrapper">
                <select id="race-boat">
                    <option value="1R">1R</option><option value="2R">2R</option><option value="3R">3R</option><option value="4R">4R</option><option value="5R">5R</option><option value="6R">6R</option><option value="7R">7R</option><option value="8R">8R</option><option value="9R">9R</option><option value="10R" selected>10R</option><option value="11R">11R</option><option value="12R">12R</option>
                </select>
            </div>
            <button class="btn-boat" onclick="search('boat')">𝕏 で探す</button>
        </div>
    </div>
</div>

<div class="info-display-outer">
    <span class="info-label" id="strategy-label">TRACK ANALYSIS</span>
    <div id="info-grid" class="info-grid"></div>
</div>

<div class="dots"><div class="dot active" id="dot0"></div><div class="dot" id="dot1"></div></div>

<div class="ad-space">Sponsor / Advertisement</div>

<div class="footer-nav">
    <a href="https://note.com/deep_lilac7083" target="_blank">note</a>
    <a href="#">プライバシーポリシー</a>
    <a href="#">利用規約</a>
</div>

<script>
    const keirinData = {
        "函館":["400m","51.3m","30度","差し","海風が入り込む重いバンク。"], "青森":["400m","58.9m","32度","差し","直線が長く後方から捲りが決まる。"], "いわき平":["400m","62.7m","32度","差し","空中バンク。風の通り道で波乱あり。"], "弥彦":["400m","63.1m","32度","差し","直線が非常に長い。追い込み有利。"], "前橋":["333m","46.7m","36度","逃げ","超高速ドーム。カントがきつい。"], "取手":["400m","54.8m","31度","万能","クセがなく力通りの決着が多い。"], "宇都宮":["500m","63.3m","25度","差し","500mバンクの中では捲りやすい。"], "大宮":["500m","66.7m","24度","差し","日本一の直線長。先行は粘りが必要。"], "西武園":["400m","47.6m","30度","逃げ","直線が短く先行・番手が有利。"], "京王閣":["400m","51.5m","32度","差し","多摩川の風の影響を考慮。"], "立川":["400m","58.0m","31度","差し","直線が長くゴール前で入れ替わる。"], "松戸":["333m","38.2m","29度","逃げ","333の代表格。先行が止まらない。"], "千葉":["250m","---","30度","脚力","PIST6専用。純粋なスピード勝負。"], "川崎":["400m","58.0m","32度","差し","クセのないバンクで力勝負。"], "平塚":["400m","54.2m","31度","差し","海風の影響あり。カントは標準。"], "小田原":["333m","36.1m","35度","逃げ","カントきつく直線が短い。逃げ絶対。"], "伊東":["333m","46.6m","35度","逃げ","333にしては直線があり捲りも届く。"], "静岡":["400m","56.4m","30度","差し","富士山からの風「駿河おろし」に注意。"], "名古屋":["400m","58.8m","34度","差し","カントがきつい力勝負バンク。"], "岐阜":["400m","59.3m","31度","差し","直線長く、追い込みがよく伸びる。"], "大垣":["400m","56.2m","32度","差し","伊吹おろしが強いと先行苦戦。"], "豊橋":["400m","56.2m","33度","差し","風が強く、重いバンクと言われる。"], "富山":["333m","43.0m","31度","逃げ","風の影響が強いサンサンバンク。"], "松阪":["400m","61.5m","32度","差し","直線がかなり長く差し有利。"], "四日市":["400m","62.4m","32度","差し","ナイター専用。海沿いで重い。"], "福井":["400m","52.8m","31度","逃げ","クセがなく自力選手が走りやすい。"], "奈良":["333m","38.0m","33度","逃げ","極端に直線が短い。先行有利。"], "向日町":["400m","47.3m","30度","逃げ","直線が短く前々が有利。"], "和歌山":["400m","59.9m","32度","差し","海風が強く直線で伸びる。"], "岸和田":["400m","56.7m","30度","差し","クセがなく力が出やすい。"], "玉野":["400m","47.9m","30度","逃げ","瀬戸内の風に注意。直線は短い。"], "広島":["400m","57.9m","30度","差し","クセはないが風で重くなる。"], "防府":["333m","42.5m","33度","逃げ","先行が止まらないサンサン。"], "高松":["400m","54.4m","31度","差し","風が不規則で波乱要素あり。"], "小松島":["400m","55.5m","30度","差し","海が近く風が非常に強い。"], "高知":["500m","52.0m","24度","万能","500だが直線が短く捲りも決まる。"], "松山":["400m","58.5m","31度","差し","カントきつく捲りが加速する。"], "小倉":["400m","56.9m","34度","差し","ドーム無風。スピード戦必至。"], "久留米":["400m","50.7m","31度","万能","クセ少なく力勝負。"], "武雄":["400m","64.4m","30度","差し","日本一の長直線。追い込み有利。"], "佐世保":["400m","40.2m","31度","逃げ","直線が短い。先行粘り込み。"], "別府":["400m","59.9m","33度","差し","風の影響で直線が伸びる。"], "熊本":["500m","60.3m","28度","差し","直線長く最後に入れ替わる。"]
    };

    const boatData = {
        "桐生":["淡水","なし","標準","イン・捲り","標高高く冬は赤城おろし。"], "戸田":["淡水","なし","減音","捲り差し","日本一狭くインが弱い。"], "江戸川":["汽水","あり","標準","捲り","日本一の難所。風と潮に左右。"], "平和島":["海水","あり","標準","差し・捲り","インが弱く配当が跳ねる。"], "多摩川":["淡水","なし","標準","差し","日本一の静水面。スピード戦。"], "浜名湖":["汽水","あり","標準","差し・捲り","広大な水面。"], "蒲郡":["海水","なし","標準","イン有利","ナイターはイン信頼度高。"], "常滑":["海水","なし","標準","イン有利","冬の伊勢湾の風に注意。"], "津":["海水","あり","標準","イン・捲り","鈴鹿おろしの強風あり。"], "三国":["淡水","なし","標準","イン・捲り","1マーク広く多彩な攻め。"], "びわこ":["淡水","なし","標準","捲り","1マーク狭くイン苦戦。"], "住之江":["淡水","なし","標準","イン最強","ボートの聖地。イン逃げ。"], "尼崎":["淡水","なし","標準","イン有利","静水面でイン強い。"], "鳴門":["海水","あり","標準","捲り差し","潮流が速い。"], "丸亀":["海水","あり","標準","イン・差し","潮の満ち引きで傾向変化。"], "児島":["海水","あり","標準","イン有利","瀬戸内の潮の影響。"], "宮島":["海水","あり","標準","イン有利","潮位差大きく満潮イン有利。"], "徳山":["海水","あり","標準","イン最強","全国トップのイン勝率。"], "下関":["海水","あり","標準","イン有利","ナイターイン逃げメイン。"], "若松":["海水","あり","標準","イン・捲り","夜はさらにイン強化。"], "芦屋":["淡水","なし","標準","イン最強","モーニングのイン信頼。"], "福岡":["海水","あり","標準","捲り差し","特殊な水面。1コース難。"], "唐津":["淡水","なし","標準","イン有利","水面広く実力者が勝つ。"], "大村":["海水","あり","標準","イン絶対","イン勝率は日本一。"]
    };

    let currentIdx = 0;
    function init() {
        fillSelect("track-keirin", Object.keys(keirinData));
        fillSelect("track-boat", Object.keys(boatData));
        updateClock(); setInterval(updateClock, 1000);
        updateInfo();
    }
    function fillSelect(id, list) {
        const el = document.getElementById(id);
        list.sort().forEach(t => { const o = document.createElement("option"); o.value = t; o.textContent = t; el.appendChild(o); });
    }
    function updateInfo() {
        const type = currentIdx === 0 ? 'keirin' : 'boat';
        const val = document.getElementById(`track-${type}`).value;
        const grid = document.getElementById('info-grid');
        const label = document.getElementById('strategy-label');
        if (type === 'keirin') {
            const d = keirinData[val]; label.innerText = "TRACK ANALYSIS";
            grid.innerHTML = `<div class="info-item"><b>バンク</b>${d[0]}</div><div class="info-item"><b>直線</b>${d[1]}</div><div class="info-item"><b>カント</b>${d[2]}</div><div class="info-item"><b>決まり</b>${d[3]}</div><div class="info-description">${d[4]}</div>`;
        } else {
            const d = boatData[val]; label.innerText = "WATER ANALYSIS";
            grid.innerHTML = `<div class="info-item"><b>水質</b>${d[0]}</div><div class="info-item"><b>潮流</b>${d[1]}</div><div class="info-item"><b>モータ</b>${d[2]}</div><div class="info-item"><b>傾向</b>${d[3]}</div><div class="info-description">${d[4]}</div>`;
        }
    }
    function search(type) {
        const t = document.getElementById(`track-${type}`).value;
        const r = document.getElementById(`race-${type}`).value;
        window.open(`https://twitter.com/search?q=${encodeURIComponent(t + (type==='keirin'?'競輪':'ボート') + ' ' + r + ' 予想')}&f=live`);
    }
    function updateClock() {
        const n = new Date();
        document.getElementById("date").innerText = `${n.getFullYear()}.${n.getMonth()+1}.${n.getDate()} ${['SUN','MON','TUE','WED','THU','FRI','SAT'][n.getDay()]}`;
        document.getElementById("time").innerText = n.toTimeString().split(' ')[0];
    }
    let sX = 0;
    window.addEventListener("touchstart", (e) => { sX = e.touches[0].pageX; });
    window.addEventListener("touchend", (e) => {
        let diff = sX - e.changedTouches[0].pageX;
        if (Math.abs(diff) > 50) {
            currentIdx = diff > 0 ? 1 : 0;
            document.getElementById("canvas").style.transform = `translateX(-${currentIdx * 50}%)`;
            document.getElementById("dot0").className = `dot ${currentIdx===0?'active':''}`;
            document.getElementById("dot1").className = `dot ${currentIdx===1?'active':''}`;
            updateInfo();
        }
    });
    init();
</script>
</body>
</html>
