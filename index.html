<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>競輪予想サーチ Pro</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #1a2a3a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* 画面全体の高さを少し余裕持たせ、パツパツを防ぐ */
            min-height: 100vh;
            margin: 0;
            padding: 30px 20px; 
            box-sizing: border-box;
        }
        /* 時計のスタイル：少しだけ小さくして余白を確保 */
        #clock-container {
            color: white;
            text-align: center;
            margin-bottom: 15px;
            font-family: 'Courier New', Courier, monospace;
            flex-shrink: 0;
        }
        #date {
            font-size: 13px;
            letter-spacing: 2px;
            opacity: 0.6;
        }
        #time {
            font-size: 28px;
            font-weight: bold;
            margin-top: 3px;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
        /* 白い枠：サイズを固定して背景を見せる */
        .container {
            background-color: white;
            border-radius: 25px;
            padding: 25px 20px;
            width: 100%;
            max-width: 320px; /* さらにスリムに */
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            text-align: center;
            flex-shrink: 0; /* 縦に伸びるのを強制停止 */
        }
        h1 {
            font-size: 18px;
            color: #1a2a3a;
            margin-bottom: 20px;
        }
        label {
            display: block;
            text-align: left;
            font-weight: bold;
            color: #777;
            margin-bottom: 6px;
            font-size: 12px;
        }
        .select-wrapper {
            margin-bottom: 18px;
        }
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 10px;
            font-size: 15px;
            background-color: #fcfcfc;
            color: #333;
        }
        button {
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 12px rgba(255, 126, 95, 0.3);
            margin-top: 5px;
        }
        .footer-text {
            font-size: 10px;
            color: #aaa;
            margin-top: 10px;
        }
        .note-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed #eee;
        }
        .note-link {
            color: #2cb696;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
        }
        .copyright {
            font-size: 9px;
            color: #ccc;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div id="clock-container">
    <div id="date"></div>
    <div id="time"></div>
</div>

<div class="container">
    <h1>🚴‍♂️ 競輪予想サーチ Pro</h1>
    
    <label>開催地を選択</label>
    <div class="select-wrapper">
        <select id="track"></select>
    </div>

    <label>レース番号</label>
    <div class="select-wrapper">
        <select id="race">
            <option value="1R">1R</option>
            <option value="2R">2R</option>
            <option value="3R">3R</option>
            <option value="4R">4R</option>
            <option value="5R">5R</option>
            <option value="6R">6R</option>
            <option value="7R">7R</option>
            <option value="8R">8R</option>
            <option value="9R">9R</option>
            <option value="10R">10R</option>
            <option value="11R">11R</option>
            <option value="12R">12R</option>
        </select>
    </div>

    <button onclick="search()">𝕏 でリアルタイム予想を探す</button>
    <p class="footer-text">※最新の出走表と照らし合わせてご確認ください</p>

    <div class="note-section">
        <p style="font-size: 11px; color: #999; margin-bottom: 5px;">数値から展開を読み解く「管理者の目線」</p>
        <a href="https://note.com/deep_lilac7083" target="_blank" class="note-link">公式note: deep_lilac7083</a>
        <p class="copyright">&copy; 2024 Keirin Prediction Tool</p>
    </div>
</div>

<script>
    function updateClock() {
        const now = new Date();
        const y = now.getFullYear();
        const m = now.getMonth() + 1;
        const d = now.getDate();
        const dayList = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
        document.getElementById("date").innerText = `${y}.${m}.${d} ${dayList[now.getDay()]}`;
        document.getElementById("time").innerText = now.toLocaleTimeString('ja-JP', { hour12: false });
    }
    setInterval(updateClock, 1000);

    const tracks = ["函館", "青森", "いわき平", "弥彦", "前橋", "取手", "宇都宮", "大宮", "西武園", "京王閣", "立川", "松戸", "千葉", "川崎", "平塚", "小田原", "伊東", "静岡", "名古屋", "岐阜", "大垣", "豊橋", "富山", "松阪", "四日市", "福井", "奈良", "向日町", "和歌山", "岸和田", "玉野", "広島", "防府", "高松", "小松島", "松山", "高知", "小倉", "久留米", "武雄", "佐世保", "別府", "熊本"];
    
    function init() {
        const trackSelect = document.getElementById("track");
        tracks.sort().forEach(t => {
            const o = document.createElement("option");
            o.value = t; o.textContent = t; trackSelect.appendChild(o);
        });
        updateClock();
    }

    function search() {
        const track = document.getElementById("track").value;
        const race = document.getElementById("race").value;
        const query = encodeURIComponent(`${track}競輪 ${race} 予想`);
        window.open(`https://twitter.com/search?q=${query}&f=live`, '_blank');
    }

    init();
</script>

</body>
</html>
