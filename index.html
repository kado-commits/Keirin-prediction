<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>公営競技サーチ Pro</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #1a2a3a; margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* 時計エリア */
        #clock-container { color: white; text-align: center; margin-bottom: 15px; font-family: 'Courier New', Courier, monospace; flex-shrink: 0; }
        #date { font-size: 13px; letter-spacing: 2px; opacity: 0.6; }
        #time { font-size: 28px; font-weight: bold; margin-top: 3px; }

        .slider-viewport { width: 100%; max-width: 330px; overflow: hidden; position: relative; }
        .slider-canvas { display: flex; transition: transform 0.3s ease-out; width: 200%; }
        
        .container { background-color: white; border-radius: 25px; padding: 25px 20px; width: 50%; box-sizing: border-box; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.4); flex-shrink: 0; margin: 0 5px; }
        .keirin-card { border-top: 8px solid #ff7e5f; }
        .boat-card { border-top: 8px solid #0091ff; }

        h1 { font-size: 18px; color: #1a2a3a; margin-bottom: 20px; }
        label { display: block; text-align: left; font-weight: bold; color: #777; margin-bottom: 6px; font-size: 12px; }
        .select-wrapper { margin-bottom: 18px; }
        select { width: 100%; padding: 10px; border: 1px solid #eee; border-radius: 10px; font-size: 16px; background-color: #fcfcfc; }
        
        .btn-keirin { background: linear-gradient(135deg, #ff7e5f, #feb47b); color: white; border: none; padding: 15px; border-radius: 50px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; }
        .btn-boat { background: linear-gradient(135deg, #0091ff, #64b5f6); color: white; border: none; padding: 15px; border-radius: 50px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; }

        /* noteセクションの調整 */
        .note-section { margin-top: 20px; padding-top: 15px; border-top: 1px dashed #eee; }
        .note-description { font-size: 10px; color: #999; margin-bottom: 5px; display: block; }
        .note-link { color: #2cb696; text-decoration: none; font-weight: bold; font-size: 13px; border-bottom: 1px solid #2cb696; padding-bottom: 2px; }

        /* 外側の詳細情報エリア */
        .info-display-outer { width: 100%; max-width: 320px; margin-top: 20px; text-align: center; min-height: 100px; }
        .info-label { color: #778899; font-size: 10px; font-weight: bold; letter-spacing: 2px; margin-bottom: 8px; display: block; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; color: #dcdcdc; font-size: 12px; text-align: left; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 15px; }
        .info-item b { color: #feb47b; font-size: 11px; margin-right: 4px; }
        .info-description { grid-column: 1 / 3; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; margin-top: 5px; font-size: 13px; color: #fff; text-align: center; }

        .dots { display: flex; justify-content: center; margin-top: 10px; gap: 8px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.3); }
        .dot.active { background: white; }
    </style>
</head>
<body>

<div id="clock-container">
    <div id="date"></div>
    <div id="time"></div>
</div>

<div class="slider-viewport" id="viewport">
    <div class="slider-canvas" id="canvas">
        <div class="container keirin-card">
            <h1>🚴‍♂️ 競輪予想サーチ</h1>
            <label>開催地を選択</label>
            <div class="select-wrapper"><select id="track-keirin" onchange="updateInfo()"></select></div>
            <label>レース番号</label>
            <div class="select-wrapper"><select id="race-keirin"></select></div>
            <button class="btn-keirin" onclick="search('keirin')">𝕏 で探す</button>
            <div class="note-section">
                <span class="note-description">数値から展開を読み解く</span>
                <a href="https://note.com/deep_lilac7083" target="_blank" class="note-link">管理者の競輪noteを読む</a>
            </div>
        </div>
        <div class="container boat-card">
            <h1>🚤 ボート予想サーチ</h1>
            <label>開催地を選択</label>
            <div class="select-wrapper"><select id="track-boat" onchange="updateInfo()"></select></div>
            <label>レース番号</label>
            <div class="select-wrapper"><select id="race-boat"></select></div>
            <button class="btn-boat" onclick="search('boat')">𝕏 で探す</button>
            <div class="note-section">
                <span class="note-description">独自の波面分析・モーター評価</span>
                <a href="https://note.com/deep_lilac7083" target="_blank" class="note-link">管理者のボートnoteを読む</a>
            </div>
        </div>
    </div>
</div>

<div class="info-display-outer">
    <span class="info-label" id="strategy-label">FIELD STRATEGY</span>
    <div id="info-grid" class="info-grid"></div>
</div>

<div class="dots">
    <div class="dot active" id="dot0"></div>
    <div class="dot" id="dot1"></div>
</div>

<script>
    // データ（前のままですが、ここを埋めると最強になります）
    const keirinData = {
        "いわき平": { bank: "400m", straight: "62.7m", cant: "32°54′", trend: "逃げ・差し均衡", desc: "国内唯一の空中バンク。風の通り道に注意。" },
        "松戸": { bank: "333m", straight: "38.2m", cant: "29°44′", trend: "先行圧倒的有利", desc: "日本一直線が短い。前々にいないと厳しい。" },
        "名古屋": { bank: "400m", straight: "58.8m", cant: "34°01′", trend: "差し・捲り有利", desc: "直線が長くカントもきつい。自力選手の仕掛け所が重要。" },
        "default": { bank: "---", straight: "---", cant: "---", trend: "要確認", desc: "会場を選択すると詳細データが表示されます。" }
    };

    const boatData = {
        "住之江": { water: "淡水", flow: "なし", motor: "標準", trend: "イン最強", desc: "工業用水を使用しており硬い水面。イン逃げ信頼。" },
        "戸田": { water: "淡水", flow: "なし", motor: "減音", trend: "捲り差し波乱", desc: "コース幅が非常に狭い。カドからの捲りが炸裂する場。" },
        "平和島": { water: "海水", flow: "あり", motor: "標準", trend: "差し・捲り", desc: "インの勝率が極めて低い。バックストレッチの伸びに注目。" },
        "default": { water: "---", flow: "---", motor: "---", trend: "要確認", desc: "会場を選択すると詳細データが表示されます。" }
    };

    const kTracks = ["函館", "青森", "いわき平", "弥彦", "前橋", "取手", "宇都宮", "大宮", "西武園", "京王閣", "立川", "松戸", "千葉", "川崎", "平塚", "小田原", "伊東", "静岡", "名古屋", "岐阜", "大垣", "豊橋", "富山", "松阪", "四日市", "福井", "奈良", "向日町", "和歌山", "岸和田", "玉野", "広島", "防府", "高松", "小松島", "松山", "高知", "小倉", "久留米", "武雄", "佐世保", "別府", "熊本"];
    const bTracks = ["桐生", "戸田", "江戸川", "平和島", "多摩川", "浜名湖", "蒲郡", "常滑", "津", "三国", "びわこ", "住之江", "尼崎", "鳴門", "丸亀", "児島", "宮島", "徳山", "下関", "若松", "芦屋", "福岡", "唐津", "大村"];
    
    let currentIdx = 0;

    function init() {
        fillSelect("track-keirin", kTracks);
        fillSelect("track-boat", bTracks);
        fillSelect("race-keirin", Array.from({length: 12}, (_, i) => (i+1) + "R"));
        fillSelect("race-boat", Array.from({length: 12}, (_, i) => (i+1) + "R"));
        updateInfo();
        updateClock(); setInterval(updateClock, 1000);
    }

    function fillSelect(id, list) {
        const el = document.getElementById(id);
        list.sort().forEach(t => {
            const o = document.createElement("option"); o.value = t; o.textContent = t; el.appendChild(o);
        });
    }

    function updateInfo() {
        const type = currentIdx === 0 ? 'keirin' : 'boat';
        const val = document.getElementById(`track-${type}`).value;
        const grid = document.getElementById('info-grid');
        const label = document.getElementById('strategy-label');
        
        if (type === 'keirin') {
            const d = keirinData[val] || keirinData["default"];
            label.innerText = "TRACK ANALYSIS";
            grid.innerHTML = `<div class="info-item"><b>バンク</b>${d.bank}</div><div class="info-item"><b>直線</b>${d.straight}</div><div class="info-item"><b>カント</b>${d.cant}</div><div class="info-item"><b>傾向</b>${d.trend}</div><div class="info-description">${d.desc}</div>`;
        } else {
            const d = boatData[val] || boatData["default"];
            label.innerText = "WATER ANALYSIS";
            grid.innerHTML = `<div class="info-item"><b>水質</b>${d.water}</div><div class="info-item"><b>潮流</b>${d.flow}</div><div class="info-item"><b>モーター</b>${d.motor}</div><div class="info-item"><b>傾向</b>${d.trend}</div><div class="info-description">${d.desc}</div>`;
        }
    }

    function search(type) {
        const track = document.getElementById(`track-${type}`).value;
        const race = document.getElementById(`race-${type}`).value;
        const query = encodeURIComponent(`${track}${type==='keirin'?'競輪':'ボートレース'} ${race} 予想`);
        window.open(`https://twitter.com/search?q=${query}&f=live`, '_blank');
    }

    function updateClock() {
        const now = new Date();
        const y = now.getFullYear(); const m = now.getMonth() + 1; const d = now.getDate();
        const day = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"][now.getDay()];
        document.getElementById("date").innerText = `${y}.${m}.${d} ${day}`;
        document.getElementById("time").innerText = now.toLocaleTimeString('ja-JP', { hour12: false });
    }

    let startX = 0;
    const canvas = document.getElementById("canvas");
    window.addEventListener("touchstart", (e) => { startX = e.touches[0].pageX; });
    window.addEventListener("touchend", (e) => {
        let diff = startX - e.changedTouches[0].pageX;
        if (Math.abs(diff) > 50) {
            currentIdx = diff > 0 ? 1 : 0;
            canvas.style.transform = `translateX(-${currentIdx * 50}%)`;
            document.getElementById("dot0").classList.toggle("active", currentIdx === 0);
            document.getElementById("dot1").classList.toggle("active", currentIdx === 1);
            updateInfo();
        }
    });
    init();
</script>
</body>
</html>
